  # London (M12 pilot): 40 large FTSE 100 names with Yahoo history from early 2018, all quoted in
  # pence. Left out for history too short to train beside the rest: M&G (2019), Haleon (2022);
  # Ashtead is no longer listed in London. Compass and IHG are left out because Yahoo quotes their
  # London lines in US dollars, and a book is one market in one currency; the next two largest by
  # market value, Fresnillo and IAG, take their places.
