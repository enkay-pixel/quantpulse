# Research branch (ADR 0007): the English Wikipedia article whose daily page views stand for
# each stock's public attention. Read by quantpulse.research.attention; not part of the model.
#
# Titles must be the CANONICAL article, exactly. The page-view API counts views of the title
# given and nothing else — views that arrive through a redirect are not included — so a title
# that is a redirect returns a small, plausible-looking number that is simply wrong. Each fetch
# resolves the titles first and skips any that is a redirect, a disambiguation page or missing,
# naming it in the run log.
#
# Stocks only. ETFs and the JSE benchmark are left out: a fund's page measures interest in the
# fund, not in any company. Dual-listed companies (BHP, Anglo American, British American
# Tobacco, Prosus) draw attention from every market they trade in, not from the JSE alone.
