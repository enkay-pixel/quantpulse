# Plain-language names for every term the dashboard shows and the API returns — one source.
#
# The API's field descriptions (its /docs page) and the dashboard's labels and hover help both
# read this file, so a term means the same thing everywhere, and a test fails when a field or a
# column header has no entry. `make glossary` copies it into the dashboard bundle.
#
#   label    the plain name shown first
#   term     the technical name, shown small beneath it (omit when the label is already the term)
#   meaning  one sentence: what it is
#   read     optional: how to read it — which direction is good, where the thresholds are
terms:
  # --- identifiers and dates -----------------------------------------------------------------
  ticker:
    label: Ticker
    meaning: The stock's symbol on its exchange. JSE symbols end in .JO.
  exchange:
    label: Market
    term: exchange
    meaning: Which stock exchange the figures belong to. XNYS is the New York Stock Exchange, XJSE the Johannesburg Stock Exchange.
  code:
    label: Market code
    meaning: The exchange's standard four-letter code, such as XNYS or XJSE.
  asset_type:
    label: Kind
    meaning: Whether the ticker is a company's stock or a fund (ETF) that holds many stocks.
  active:
    label: Active
    meaning: Whether the ticker is still tracked. Inactive tickers keep their history but get no new data.
  date:
    label: Date
    meaning: The trading day the figures are for.
  start_date:
    label: From
    meaning: The first trading day included.
  end_date:
    label: To
    meaning: The last trading day included.
  as_of:
    label: As of
    meaning: The newest day the figures cover.
  created_at:
    label: Recorded
    meaning: When the row was written.
  timestamp:
    label: When
    meaning: When it happened.
  id:
    label: ID
    meaning: An identifier for this item.
  url:
    label: Link
    meaning: Where to read the full write-up.
  title:
    label: Title
    meaning: A short name for the item.
  note:
    label: Note
    meaning: A remark recorded with the item.
  detail:
    label: Detail
    meaning: The figures behind the item's state, in words.
  timezone:
    label: Time zone
    meaning: The exchange's local time zone, which decides when its trading day ends.
  currency:
    label: Currency
    meaning: The currency prices are quoted in.
  display_symbol:
    label: Currency symbol
    meaning: The symbol shown in front of prices for this market.
  display_divisor:
    label: Price divisor
    meaning: What stored prices are divided by before display. The JSE stores prices in cents, so its divisor is 100.
  configured:
    label: Configured
    meaning: Whether the market is set up in the configuration file.
  has_options:
    label: Has option data
    meaning: Whether free option chains exist for this market. Only the NYSE has them.
  benchmark:
    label: Benchmark
    meaning: The index fund the market's results are compared with — SPY for the NYSE, STX40.JO for the JSE.

  # --- prices ------------------------------------------------------------------------------------
  open:
    label: Open
    meaning: The first traded price of the day.
  high:
    label: High
    meaning: The highest traded price of the day.
  low:
    label: Low
    meaning: The lowest traded price of the day.
  close:
    label: Close
    meaning: The last traded price of the day, adjusted for dividends and splits.
  volume:
    label: Volume
    meaning: How many shares (or option contracts) traded that day.
  latest_close:
    label: Latest close
    meaning: The most recent closing price.
  spot:
    label: Stock price
    term: spot
    meaning: The stock's price when the option chain was captured, after the close.
  underlying_close:
    label: Stock price
    term: underlying close
    meaning: The closing price of the stock an option is written on, on the snapshot day.

  # --- the model and its forecasts -----------------------------------------------------------
  score:
    label: Model's forecast, next month
    term: 21-day signal
    meaning: The return the model predicts for the stock over the next 21 trading days (about a month). Only the ranking across stocks is used — the top ones are bought and the bottom ones sold short on paper.
    read: Higher means the model expects the stock to do better than the others. It is a research output, not advice.
  signal:
    label: Model's forecast, next month
    term: 21-day signal
    meaning: The model's predicted return for this stock over the next 21 trading days.
    read: Higher means the model expects the stock to do better than the others.
  latest_score:
    label: Latest forecast
    term: 21-day signal
    meaning: The model's most recent predicted 21-day return for the stock.
  rank:
    label: Rank
    meaning: The stock's position when every stock in the market is sorted by the model's forecast. 1 is the strongest.
  model_version:
    label: Model version
    meaning: Which trained model made the forecast. Each retraining that passes the gate gets a new version number.
  is_current:
    label: Current champion
    meaning: Whether this model is the one currently making the forecasts.
  trained_at:
    label: Trained
    meaning: When the model was fitted.
  run_type:
    label: Run type
    meaning: What the training run was — a candidate (train), a promotion, a demotion, or a shadow fitted only for comparison.
  decision:
    label: Decision
    meaning: What the promotion gate decided about a candidate model — promoted to champion, or rejected.
  metrics:
    label: Measurements
    meaning: The candidate's scores on the data it was tested on, such as ranking accuracy and Sharpe ratio.
  mlflow_run_id:
    label: Experiment record
    term: MLflow run ID
    meaning: The training run's identifier in MLflow, the experiment tracker, where its full details are kept.
  holdout_ic:
    label: Ranking accuracy
    term: holdout IC
    meaning: How closely the model's ordering of stocks matched the order they actually performed in, measured on recent data it was not trained on (a rank correlation).
    read: 0 is no better than chance and 1 is perfect. For ranking stocks a month ahead, around 0.05 is already useful.
  holdout_sharpe:
    label: Return per unit of risk, test period
    term: holdout Sharpe
    meaning: The Sharpe ratio a paper book following the model earned on the test period.
    read: Higher is better; below 0 lost money.
  holdout_max_drawdown:
    label: Worst fall, test period
    term: holdout max drawdown
    meaning: The largest peak-to-trough loss of that paper book over the test period.
    read: Closer to 0 is better.
  window:
    label: Served as champion
    meaning: The days this model was the champion making the live forecasts.
  phase:
    label: Phase
    meaning: Replay means figures from before the model went live, which it may have been fitted on — a description of the fit, not evidence. Live means genuinely out-of-sample.
    read: Judge only the live phase.
  live_window:
    label: Live window
    meaning: The first and last trading day of the live record.
  live_since:
    label: Live since
    meaning: The day the market's first champion model was promoted. Everything from here is genuinely out-of-sample.

  # --- performance -------------------------------------------------------------------------------
  equity:
    label: Book value
    term: equity
    meaning: The paper book's value, starting at 1.0. 1.10 means it is up 10%.
  benchmark_equity:
    label: Index fund value
    meaning: What buying the market's index fund and holding it would be worth, on the same scale as the book.
  horizon_equity:
    label: Monthly-rebalanced book value
    meaning: The same signal traded only every 21 days instead of daily, on the same scale.
  daily_return:
    label: Daily return
    meaning: The book's gain or loss that day, after costs.
  total_return:
    label: Total return
    meaning: The book's gain or loss over the whole period.
  annualized_return:
    label: Yearly return
    term: annualized return
    meaning: The total return scaled to a one-year rate.
    read: Over short periods this exaggerates — a few weeks scaled up to a year is not a rate anything has sustained.
  annualized_gross_return:
    label: Yearly return before costs
    term: annualized gross return
    meaning: The yearly return before trading costs are taken off.
  annualized_volatility:
    label: Yearly swings
    term: annualized volatility
    meaning: How much the book's value moves around, as a yearly standard deviation.
    read: Lower is calmer.
  avg_daily_return:
    label: Average daily return
    meaning: The mean gain or loss per trading day.
  sharpe:
    label: Return per unit of risk
    term: Sharpe ratio
    meaning: Yearly return divided by yearly swings. It says how much return the book earned for the ups and downs it went through.
    read: Above 1 is good, around 0 means no reward for the risk, below 0 lost money. Withheld under 20 trading days, where it is noise.
  rolling_sharpe_63d:
    label: Return per unit of risk, past 3 months
    term: rolling 63-day Sharpe
    meaning: The Sharpe ratio over the most recent 63 trading days, recomputed each day.
  max_drawdown:
    label: Worst fall
    term: max drawdown
    meaning: The largest drop from a high point to a later low, as a share of the high.
    read: Closer to 0 is better.
  drawdown:
    label: Below the high
    term: drawdown
    meaning: How far the book sits below its highest value so far.
  win_rate:
    label: Days up
    term: win rate
    meaning: The share of trading days the book made money.
    read: Above 50% means more up days than down, though not necessarily more money.
  n_days:
    label: Trading days
    meaning: How many trading days the figures cover.
  turnover:
    label: Share traded
    term: turnover
    meaning: How much of the book was bought or sold that day, as a share of its value.
  mean_turnover:
    label: Average share traded per day
    term: mean turnover
    meaning: How much of the book is replaced on an average day.
    read: Higher means more trading costs.
  annualized_cost_drag:
    label: Yearly cost of trading
    term: cost drag
    meaning: How much return trading costs take away per year.
    read: Lower is better.
  variant:
    label: Book
    meaning: Which version of the paper book — daily rebalancing, monthly rebalancing, or long only. Each differs from the daily book in exactly one way.
  rebalance_days:
    label: Trades every
    term: rebalance interval
    meaning: How many trading days the book holds its positions before re-forming them.
  weight:
    label: Share of the book
    term: weight
    meaning: How much of the book's value sits in this position. Negative means a short sale.
  side:
    label: Side
    meaning: Long means bought, expecting a rise. Short means sold borrowed shares, expecting a fall.

  # --- market vs signal ----------------------------------------------------------------------
  beta:
    label: Moves with the market
    term: beta
    meaning: How much the book tends to move when the market's index moves 1%.
    read: 0 means it does not follow the market at all, which is the design here; 1 means it moves one-for-one.
  alpha_daily:
    label: Return beyond the market, per day
    term: daily alpha
    meaning: The book's average daily return left over once the part explained by the market is removed.
  alpha_annualized:
    label: Return beyond the market, per year
    term: alpha
    meaning: The book's yearly return left over once the part explained by the market is removed — the part the signal earned.
    read: Only meaningful beside its error band. A figure inside its own error band cannot be told from zero.
  alpha_std_error_annualized:
    label: Error band on that
    term: alpha standard error
    meaning: How uncertain the yearly alpha estimate is. Roughly two of these either side of the estimate is the plausible range.
  alpha_t_stat:
    label: Signal strength
    term: alpha t-statistic
    meaning: The alpha divided by its error band.
    read: Beyond about ±2 the result is distinguishable from luck; inside it, it is not.
  r_squared:
    label: Share explained by the market
    term: R²
    meaning: How much of the book's ups and downs the market's moves account for.
    read: Near 0 means the book's moves are its own.
  correlation:
    label: Moves together with the market
    term: correlation
    meaning: How closely the book's daily moves line up with the market's, from -1 to 1.
  tracking_error:
    label: Difference from the market
    term: tracking error
    meaning: How much the book's return differs from the index's, as a yearly standard deviation.
  information_ratio:
    label: Return over the index per unit of difference
    term: information ratio
    meaning: The book's return above the index, divided by how differently it moves.
    read: A market-neutral book scores badly on this by construction while the index rises; read alpha instead.

  # --- does the ranking work ---------------------------------------------------------------------
  signal_quintile:
    label: Forecast group
    term: signal quintile
    meaning: Each day the stocks are split into five equal groups by the model's forecast. 1 holds the strongest forecasts, 5 the weakest.
  avg_next_day_return:
    label: Average next-day return
    meaning: How the stocks in that forecast group did on the following day, on average.
    read: If the ranking works, group 1 should do best and group 5 worst.
  overall:
    label: All days
    meaning: The figures over the whole history.
  recent:
    label: Recent days
    meaning: The figures over roughly the last 30 trading days.

  # --- drift: has the market changed --------------------------------------------------------------
  feature:
    label: Model input
    term: feature
    meaning: One of the 13 measurements the model reads for each stock each day.
  psi:
    label: Shift from training
    term: PSI, population stability index
    meaning: How far this input's recent values have moved away from the values the model was trained on.
    read: Under 0.10 is no real change, 0.10–0.20 a moderate shift, above 0.20 counts as drifted.
  drifted:
    label: Drifted
    meaning: Whether this input's shift from training is above 0.20.
  share_drifted:
    label: Inputs drifted
    meaning: The share of the 13 model inputs whose shift from training is above 0.20.
    read: At 30% or more, the model is retrained early.
  psi_threshold:
    label: Alarm level per input
    meaning: The shift from training above which one model input counts as drifted.
  share_threshold:
    label: Alarm level overall
    meaning: The share of model inputs that must drift before the model is retrained early.
  features:
    label: Model inputs
    meaning: One entry per model input, with its shift from training.

  # --- the model's 13 inputs ------------------------------------------------------------------------
  ret_1:
    label: Yesterday's return
    term: ret_1
    meaning: The stock's change over the last trading day.
  ret_5:
    label: Past week's return
    term: ret_5
    meaning: The stock's change over the last 5 trading days.
  ret_21:
    label: Past month's return
    term: ret_21
    meaning: The stock's change over the last 21 trading days.
  mom_63:
    label: Past 3 months' return
    term: mom_63, momentum
    meaning: The stock's change over the last 63 trading days.
  vol_21:
    label: Past month's swings
    term: vol_21
    meaning: How much the stock's daily returns varied over the last 21 trading days.
  vol_63:
    label: Past 3 months' swings
    term: vol_63
    meaning: How much the stock's daily returns varied over the last 63 trading days.
  ma_ratio_21:
    label: Price vs its 1-month average
    term: ma_ratio_21
    meaning: How far the price sits above or below its average over the last 21 trading days.
  ma_ratio_63:
    label: Price vs its 3-month average
    term: ma_ratio_63
    meaning: How far the price sits above or below its average over the last 63 trading days.
  volume_z_21:
    label: Trading activity vs usual
    term: volume_z_21
    meaning: How unusual today's trading volume is compared with the last 21 days.
  ret_5_cs_rank:
    label: Past week's return, ranked
    term: ret_5_cs_rank
    meaning: Where the stock's past-week return ranks among all stocks in its market that day, from 0 to 1.
  ret_21_cs_rank:
    label: Past month's return, ranked
    term: ret_21_cs_rank
    meaning: Where the stock's past-month return ranks among all stocks in its market that day, from 0 to 1.
  mom_63_cs_rank:
    label: Past 3 months' return, ranked
    term: mom_63_cs_rank
    meaning: Where the stock's past-3-month return ranks among all stocks in its market that day, from 0 to 1.
  ma_ratio_21_cs_rank:
    label: Price vs 1-month average, ranked
    term: ma_ratio_21_cs_rank
    meaning: Where the stock's distance from its 1-month average ranks among all stocks in its market that day, from 0 to 1.

  # --- options ------------------------------------------------------------------------------------------
  option_type:
    label: Call or put
    meaning: A call is the right to buy 100 shares at the strike price before expiry; a put is the right to sell them.
  strike:
    label: Strike price
    term: strike
    meaning: The price at which the option lets its holder buy (call) or sell (put) the stock.
  expiry:
    label: Expiry
    meaning: The last day the option can be used. After it, the option is worth only what it pays out.
  days_to_expiry:
    label: Days left
    term: days to expiry
    meaning: Calendar days until the option expires.
  bid:
    label: Bid
    meaning: The highest price a buyer is offering, per share. Selling gets you the bid.
  ask:
    label: Ask
    meaning: The lowest price a seller is asking, per share. Buying costs you the ask.
  mid:
    label: Midpoint price
    term: mid
    meaning: Halfway between the bid and the ask — a fair-value estimate. Real trades pay more to buy and get less to sell.
  last_price:
    label: Last traded price
    meaning: The price of the most recent trade in the contract.
  open_interest:
    label: Contracts open
    term: open interest, OI
    meaning: How many contracts exist and have not yet been closed or exercised.
  call_oi:
    label: Call contracts open
    term: call open interest
    meaning: How many call contracts are open on the stock.
  put_oi:
    label: Put contracts open
    term: put open interest
    meaning: How many put contracts are open on the stock.
  put_call_ratio:
    label: Puts per call
    term: put/call ratio
    meaning: Open put contracts divided by open call contracts.
    read: Above 1 means more protection or bearish bets than bullish ones.
  n_contracts:
    label: Contracts captured
    meaning: How many option contracts were recorded for the stock in the snapshot.
  implied_volatility:
    label: Priced-in swings
    term: implied volatility, IV
    meaning: How much movement the option's price assumes, as a yearly percentage.
    read: Higher means the market expects bigger moves, which makes options dearer.
  atm_iv:
    label: Priced-in swings, near the price
    term: at-the-money IV
    meaning: Implied volatility of the option closest to the current price, about a month out — the market's headline volatility estimate for the stock.
  atm_days:
    label: Days to that option's expiry
    meaning: Calendar days until expiry for the option used for the headline implied volatility.
  avg_iv:
    label: Average priced-in swings
    term: average IV
    meaning: The mean implied volatility across the contracts in the group.
  term_structure:
    label: Priced-in swings by expiry
    term: term structure
    meaning: Implied volatility for each expiry, near to far.
  in_the_money:
    label: Worth exercising now
    term: in the money
    meaning: Whether exercising the option right now would pay something — a call when the price is above the strike, a put when below.
  theo_value:
    label: Model price
    term: theoretical value
    meaning: The option's value from the Black-Scholes formula using its implied volatility.
  delta:
    label: Share-equivalent
    term: delta, Δ
    meaning: How much the option's price moves for a $1 move in the stock — roughly how many shares, per share of the contract, it behaves like.
    read: Calls 0 to 1, puts -1 to 0. Near ±0.5 is at the money.
  gamma:
    label: How fast that changes
    term: gamma, Γ
    meaning: How much the delta changes for a $1 move in the stock.
    read: Highest near the strike and close to expiry — where hedgers must trade the most.
  theta:
    label: Daily time decay
    term: theta, Θ
    meaning: How much value the option loses per day as expiry approaches, all else equal.
  vega:
    label: Sensitivity to priced-in swings
    term: vega
    meaning: How much the option's price changes for a 1-point change in implied volatility.
  contracts:
    label: Contracts
    meaning: One entry per option contract in the chain.
  expiries:
    label: Expiries
    meaning: The expiry dates captured for the stock.
  snapshot_date:
    label: Captured on
    term: snapshot date
    meaning: The trading day whose after-close option prices were recorded.
  latest_snapshot_date:
    label: Latest options capture
    meaning: The newest day with captured option prices.
  history:
    label: History
    meaning: One entry per capture day.
  structure:
    label: Structure
    meaning: The kind of option position, such as a bull call spread.
  direction:
    label: View
    meaning: Bullish expects a rise, bearish a fall, neutral no clear view.
  rationale:
    label: Why
    meaning: How the model's forecast maps to the structure, in words.
  legs:
    label: Legs
    meaning: The individual contracts the structure is made of.
  action:
    label: Buy or sell
    meaning: Whether the leg is bought or sold.
  price:
    label: Price
    meaning: The leg's price per share, at the midpoint where quotable. A contract is 100 shares.
  net_debit:
    label: Cost to open
    term: net debit
    meaning: What the structure costs per share — the bought leg less the sold leg. A contract is 100 shares.
  max_profit:
    label: Most it can make
    term: max profit
    meaning: The largest gain per share, if the stock moves past the sold strike by expiry.
  max_loss:
    label: Most it can lose
    term: max loss
    meaning: The largest loss per share. For a debit spread this is what it cost.
  breakeven:
    label: Breakeven price
    meaning: The stock price at expiry where the structure neither gains nor loses.
  available:
    label: Available
    meaning: Whether an illustration could be built — it needs a strong enough forecast and enough quoted strikes.

  # --- the paper options book ---------------------------------------------------------------------
  opened:
    label: Opened
    meaning: The day the spreads were bought — a rebalance day of the monthly share book.
  exit_date:
    label: Closed
    meaning: The day the spreads were sold — the share book's next rebalance. Empty while still open.
  spreads:
    label: Spreads
    meaning: How many option spreads the cohort holds.
  skipped:
    label: Could not trade
    meaning: Names the share book held that the options book could not, each with the reason.
  options_return:
    label: Options book return
    meaning: What the cohort's spreads made or lost, as a share of the options book's value when they were bought.
    read: Each cohort risks a fixed tenth of the book, so this scales with that choice; compare return on premium too.
  return_on_premium:
    label: Return on what was paid
    term: return on premium
    meaning: What a spread made or lost, as a share of what it cost to open, commissions included.
    read: -100% is the most a spread can lose. It does not depend on how much of the book was risked.
  shares_return:
    label: Same names held as shares
    meaning: What the monthly share book, holding the same stocks over the same window, made or lost.
  share_equity:
    label: Monthly share book value
    meaning: The monthly-rebalanced share book's value on the same scale as the options book, both starting at 1.0 on the options book's first day.
  risk_budget:
    label: Risked per cohort
    meaning: The share of the options book's value each cohort spends on its spreads — the most a cohort can lose.
  long_strike:
    label: Bought strike
    meaning: The strike of the option bought, nearest the stock's price when the spread opened.
  short_strike:
    label: Sold strike
    meaning: The strike of the option sold, about 10% further out, which caps both the cost and the payoff.
  entry_debit:
    label: Cost to open
    term: entry debit
    meaning: What the spread cost per share — the bought option at its ask, less the sold option at its bid. A contract is 100 shares.
  mark_value:
    label: Value now
    meaning: What closing the spread would raise per share — the bought option at its bid, less buying back the sold one at its ask.
  mark_basis:
    label: Valued from
    meaning: Quote means that day's bid and ask. Last quote means one option's quote that day was missing or unreliable (no bid, or far too wide), so its last sound quote stands in. Intrinsic means no sound quote was ever seen, so it is valued at what it would pay out now. Settled means it expired.
  mark_date:
    label: Valued on
    meaning: The day the value was taken.
  cohorts:
    label: Cohorts
    meaning: One entry per group of spreads opened on the same day.
  positions:
    label: Spreads
    meaning: One entry per name in the newest cohort, including any that could not be traded.

  # --- the volatility premium ----------------------------------------------------------------------
  implied:
    label: Priced-in swings
    term: implied volatility
    meaning: What option prices assumed about the stock's movement over the next month, averaged across stocks.
  realized:
    label: Swings that then happened
    term: realized volatility
    meaning: How much the stocks actually moved over the 21 trading days that followed, on the same yearly scale.
  premium:
    label: Priced-in minus actual
    term: volatility risk premium
    meaning: Implied volatility less what then happened, in percentage points.
    read: Positive means options were priced for more movement than arrived.
  tickers:
    label: Stocks
    meaning: How many stocks the day's average covers.

  # --- research: short interest and hedging --------------------------------------------------------
  shares_short:
    label: Shares sold short
    term: short interest
    meaning: Shares borrowed and sold, not yet bought back. Short sellers lose as the price rises.
  short_pct_float:
    label: Short, share of tradable shares
    term: short % of float
    meaning: Shares sold short as a share of the shares available to trade.
    read: 10–20% is commonly called elevated and 20% or more high. GameStop's was above 100% in January 2021.
  days_to_cover:
    label: Days to buy back
    term: days to cover
    meaning: Shares sold short divided by average daily volume — how many days of normal trading it would take every short seller to buy back.
    read: Higher means a rush to buy back would move the price more.
  short_change:
    label: Change since previous report
    meaning: How shares sold short changed since the previous settlement report.
  short_settlement_date:
    label: Short interest settled
    meaning: The date the short-interest figure describes. It is published a week or two later.
  short_known_from:
    label: Short interest known from
    meaning: When the short-interest figure first became available here.
  call_gamma_usd_1pct:
    label: Call hedging per 1% move
    term: call dollar gamma
    meaning: The stock a dealer would buy per 1% rise if dealers had sold every listed call — the gamma-squeeze channel.
    read: An upper bound. Public data does not show who holds which side.
  put_gamma_usd_1pct:
    label: Put hedging per 1% move
    term: put dollar gamma
    meaning: The stock a dealer would sell per 1% fall if dealers had sold every listed put.
    read: An upper bound, for the same reason.
  call_gamma_share_of_adv:
    label: Call hedging vs normal trading
    meaning: The call hedging per 1% move, as a share of a normal day's dollar trading.
    read: Higher means hedging could move the price more.
  put_gamma_share_of_adv:
    label: Put hedging vs normal trading
    meaning: The put hedging per 1% move, as a share of a normal day's dollar trading.
  call_gamma_near_share:
    label: Call hedging expiring within a month
    meaning: The share of the call hedging exposure in contracts that expire within 30 days, where it is most concentrated.
  adv_usd_20d:
    label: Normal day's trading
    term: average dollar volume
    meaning: The average dollar value traded per day over the last 20 trading days.
  strikes:
    label: Strikes
    meaning: One entry per strike price, with the hedging exposure at it.

  # --- research: attention -----------------------------------------------------------------------------
  article:
    label: Wikipedia article
    meaning: The article whose page views stand for public attention to the company.
  views:
    label: Page views
    meaning: How many times the company's Wikipedia article was read that day.
  views_7d:
    label: Views a day, past week
    meaning: The average daily page views over the last 7 days.
  baseline_90d:
    label: Usual views a day
    term: 90-day median
    meaning: The middle value of daily page views over the 90 days before that week.
  attention_ratio:
    label: Attention vs usual
    meaning: The past week's views divided by the usual level.
    read: 1 is normal. This page calls 3 or more unusual. Attention tends to rise with a big move rather than before it.
  days:
    label: Days
    meaning: One entry per day.

  # --- decisions and findings ---------------------------------------------------------------------------
  decisions:
    label: Standing decisions
    meaning: Decisions already taken, each with the conditions named in advance that would reopen it.
  decided:
    label: Decided
    meaning: When the decision was taken.
  conditions:
    label: Reopen conditions
    meaning: The checks that would bring the decision back for review, each evaluated on the current record.
  state:
    label: State
    meaning: For a decision — standing, reopened (a condition was met), watched elsewhere, or can't be checked here. For a condition — armed, fired or unknown.
  type:
    label: Check
    meaning: Which kind of check the condition is.
  findings:
    label: Findings
    meaning: Measurements this project has made, each with its question and what came back.
  question:
    label: Question
    meaning: What the investigation set out to answer.
  outcome:
    label: Outcome
    meaning: What the evidence showed, including results later withdrawn.

  # --- pipeline health ------------------------------------------------------------------------------------
  status:
    label: Status
    meaning: The item's state. For the service, whether it is working; for an options-book spread, open, closed, or skipped because it could not be traded.
  database:
    label: Database reachable
    meaning: Whether the service could read the database.
  latest_price_date:
    label: Prices up to
    meaning: The newest trading day with prices.
  latest_feature_date:
    label: Model inputs up to
    meaning: The newest trading day with computed model inputs.
  latest_prediction_date:
    label: Forecasts up to
    meaning: The newest trading day with model forecasts.
  memory_rss_bytes:
    label: Memory in use
    meaning: How much memory the service is using, in bytes.
  memory_limit_bytes:
    label: Memory limit
    meaning: The most memory the service is allowed, in bytes.
  alerts:
    label: Alerts
    meaning: Recent pipeline failures, newest first.
  job_name:
    label: Job
    meaning: Which scheduled pipeline job failed.
  error:
    label: Error
    meaning: The failure message.
  run_id:
    label: Run
    meaning: The failed run's identifier in Dagster, the scheduler.

  # --- containers --------------------------------------------------------------------------------------
  rows:
    label: Rows
    meaning: One entry per stock.
  points:
    label: Points
    meaning: One entry per trading day.
  phases:
    label: Phases
    meaning: One entry per phase — the replay and the live record.
  books:
    label: Books
    meaning: One entry per version of the paper book.
  champions:
    label: Champions
    meaning: One entry per model that has served as champion, with its live record.
