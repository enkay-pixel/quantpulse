server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dashboard calls the API on its own origin, under /api, so it works whatever name the
    # page was opened with (localhost, 127.0.0.1) and needs no CORS. An absolute API address in
    # the bundle tied the page to the one hostname the API's allow-list named, and opening it any
    # other way blocked every request while the API was healthy.
    #
    # Resolved per request through Docker's DNS rather than once at startup: nginx then starts
    # whether or not the API is up, and follows it to a new address when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# --- Dagster (host port 3000) -------------------------------------------------------------------
# Dagster's webserver has no authentication and no host check, so a web page in this machine's
# browser could reach its API by DNS rebinding (a hostile name re-pointed at 127.0.0.1): binding to
# loopback stops the LAN, not the browser. Every request is answered here first, and only the
# names this machine uses for itself are passed on. Found in the 2026-10-22 security review.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 3000 default_server;
    server_name _;
    # Any other Host: the request was not addressed to this machine by its own name.
    return 421;
}

server {
    listen 3000;
    server_name localhost 127.0.0.1;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $dagster http://dagster-webserver:3000;
        proxy_pass $dagster;
        proxy_http_version 1.1;
        # The UI streams run logs and status over websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
