[project]
name = "quantpulse"
version = "0.1.0"
description = "Local-first MLOps platform for a self-adapting ML investing model: Dagster pipelines, MLflow registry, FastAPI serving, React dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nathan Kindo" }]
dependencies = [
    # Data & storage
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=25.0.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.4",
    # Ingestion
    "pyyaml>=6.0",
    # Capped: yfinance is the only price source, so a breaking release stops every ingest;
    # take a major deliberately. An open floor let the venv sit a full major behind the
    # lock (0.2.66 vs 1.5.1) unnoticed.
    "yfinance>=1.5.2,<2",
    "exchange-calendars>=4.5",
    "tenacity>=8.3",
    "httpx>=0.27",
    # SEC filings are XML from outside the project: parsed with entity expansion refused.
    "defusedxml>=0.7.1",
    # ML
    "scipy>=1.13",
    "lightgbm>=4.7.0",
    "optuna>=3.6",
    "mlflow>=2.15",
    "joblib>=1.4",
    # Monitoring
    "evidently>=0.4.30",
    # Orchestration & transforms
    "dagster>=1.13.15",
    "dagster-postgres>=0.24",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    # The QA toolchain is pinned EXACTLY, not floored. CI, the images and `make install` all
    # sync from uv.lock, so the lock decides what runs. The pins stay because ruff's is the
    # version the pre-commit hook is checked against (scripts/check_tool_pins.py), and pinning
    # the rest makes each tool upgrade a visible change here rather than a lock-only one. Until
    # 2026-10-31 `make install` resolved from this file into the monorepo's shared venv, where
    # a floor let the local tool drift below the locked one. Bump these via the Dependabot PR,
    # not by hand.
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==1.19.1",
    "pre-commit>=4.6.1",
    "pandas-stubs>=2.2,<3",
    "scipy-stubs>=1.14",
    "types-pyyaml>=6.0.12.20260724",
    # Starlette's TestClient warns that driving it with httpx is deprecated and will be
    # removed. Production still fetches with httpx (data/ingest.py); this is the client the
    # test harness picks up, so installing it fixes the deprecation rather than muting it.
    "httpx2>=2.12",
]

[project.urls]
Repository = "https://github.com/enkay-pixel/quantpulse"

[project.scripts]
quantpulse = "quantpulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "PD",  # pandas-vet
]

[tool.ruff.lint.isort]
# Explicit: import grouping must not depend on environment-sensitive inference
known-first-party = ["quantpulse"]

[tool.ruff.lint.per-file-ignores]
# pivot (not pivot_table) is deliberate: duplicate keys must raise, not aggregate
"src/quantpulse/ml/portfolio.py" = ["PD010"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quantpulse"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "lightgbm.*",
    "evidently.*",
    "exchange_calendars.*",
    "joblib.*",
    "mlflow.*",
    "defusedxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need a running Postgres (deselect with '-m \"not integration\"')",
]
# A warning raised from this project's own code fails the run that introduces it, rather than
# scrolling past in a wall of third-party noise. That includes a library's deprecation when our
# call is what triggers it, since the warning names the caller's module. A warning a library
# raises from its own code is shown, not fatal: until 2026-10-31 every warning was an error, so
# each upstream deprecation stopped a dependency round until someone wrote an ignore for it
# (starlette's test client on anyio 4.15 was the last). Leaks and errors escaping a thread or a
# finalizer stay fatal from anywhere, because they are bugs rather than notices. pytest applies
# these bottom-up, so a later line wins. The ignores below silence upstream noise that would
# otherwise print on every run; each needs the reason and a way out.
filterwarnings = [
    "default",
    "error:::quantpulse",
    # Test modules are imported by file name (there is no tests/__init__.py).
    "error:::test_",
    "error:::conftest",
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    # exchange_calendars builds numpy timedeltas without an explicit unit, which numpy 2.5
    # deprecates. 4.13.2 is the latest release and still does it, so there is no version to
    # move to. Scoped to the message and the module so our own timedelta misuse still fails.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # Raised inside mlflow.types.type_hints while it infers a schema from one of its own
    # pydantic models that carries an Any field. Nothing this project passes to log_model
    # changes it — an explicit ModelSignature does not silence it — and it fires on every
    # model logged. Still raised on 3.16; re-check when mlflow moves off it.
    # The leading `.*` is load-bearing: mlflow colorizes the text, so the message starts
    # with an ANSI escape and a prefix-anchored pattern never matches it.
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
    # MLflow's SQLAlchemy tracking store maps a relationship with the `noload` loader, which
    # SQLAlchemy 2.1 deprecates. Only the tests reach that store; production talks to the MLflow
    # server over HTTP. Raised as an error it aborts SQLAlchemy's global mapper configuration
    # part-way, which then fails every later test that touches a mapper with "One or more mappers
    # failed to initialize" — so one third-party warning reads as several unrelated failures.
    # Scoped to the message, and this project never uses noload, so it can only match MLflow's.
    # Deprecated, not removed: when SQLAlchemy drops it, MLflow's store breaks outright rather
    # than warning, so re-check on each MLflow or SQLAlchemy bump.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
    # dbt_common's logger opens transform/logs/dbt.log and never closes it, so running dbt
    # in-process leaks the handle and the interpreter reports it at collection. Both entries
    # are the same leak seen twice: once as the ResourceWarning, once as pytest surfacing the
    # unraisable exception from the finalizer. Scoped to that path so an unclosed file
    # anywhere else in this project still fails.
    "ignore:unclosed file .*dbt\\.log:ResourceWarning",
    "ignore:.*dbt\\.log.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/quantpulse"]
