[project]
name = "quantpulse"
version = "0.1.0"
description = "Local-first MLOps platform for a self-adapting ML investing model: Dagster pipelines, MLflow registry, FastAPI serving, React dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nathan Kindo" }]
dependencies = [
    # Data & storage
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=25.0.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.4",
    # Ingestion
    "pyyaml>=6.0",
    # Capped: fetch_daily_bars falls back to Stooq on any exception, so a breaking
    # yfinance change surfaces as a silent source switch, not an error. An open floor
    # let the venv sit a full major behind the lock (0.2.66 vs 1.5.1) unnoticed.
    "yfinance>=1.5.2,<2",
    "exchange-calendars>=4.5",
    "tenacity>=8.3",
    "httpx>=0.27",
    # ML
    "scipy>=1.13",
    "lightgbm>=4.7.0",
    "optuna>=3.6",
    "mlflow>=2.15",
    "joblib>=1.4",
    # Monitoring
    "evidently>=0.4.30",
    # Orchestration & transforms
    "dagster>=1.13.15",
    "dagster-postgres>=0.24",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    # The QA toolchain is pinned EXACTLY, not floored. CI runs `uv sync --frozen`;
    # `make install` resolves from this file into the SHARED monorepo venv, which the
    # root requirements.txt also writes to. A floor lets the local tool drift below the
    # locked one, so `make lint type test` stops being the check CI actually gates on —
    # a version whose rules/failures you never see until the PR is red. Pinning makes
    # both resolve to the same build. Bump these via the Dependabot PR, not by hand.
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "mypy==1.19.1",
    "pre-commit>=4.6.1",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "types-pyyaml>=6.0.12.20260724",
    # Starlette's TestClient warns that driving it with httpx is deprecated and will be
    # removed. Production still fetches with httpx (data/ingest.py); this is the client the
    # test harness picks up, so installing it fixes the deprecation rather than muting it.
    "httpx2>=2.12",
]

[project.urls]
Repository = "https://github.com/enkay-pixel/quantpulse"

[project.scripts]
quantpulse = "quantpulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "PD",  # pandas-vet
]

[tool.ruff.lint.isort]
# Explicit: import grouping must not depend on environment-sensitive inference
known-first-party = ["quantpulse"]

[tool.ruff.lint.per-file-ignores]
# pivot (not pivot_table) is deliberate: duplicate keys must raise, not aggregate
"src/quantpulse/ml/portfolio.py" = ["PD010"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quantpulse"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "lightgbm.*",
    "evidently.*",
    "exchange_calendars.*",
    "joblib.*",
    "mlflow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need a running Postgres (deselect with '-m \"not integration\"')",
]
# Warnings are errors, so a deprecation in this project's own code fails the run that
# introduces it rather than scrolling past in a wall of third-party noise. Anything ignored
# below is upstream and unfixable from here; each needs the reason and a way out.
filterwarnings = [
    "error",
    # exchange_calendars builds numpy timedeltas without an explicit unit, which numpy 2.5
    # deprecates. 4.13.2 is the latest release and still does it, so there is no version to
    # move to. Scoped to the message and the module so our own timedelta misuse still fails.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # Raised inside mlflow.types.type_hints while it infers a schema from one of its own
    # pydantic models that carries an Any field. Nothing this project passes to log_model
    # changes it — an explicit ModelSignature does not silence it — and it fires on every
    # model logged. Re-check when mlflow moves off 3.15.
    # The leading `.*` is load-bearing: mlflow colorizes the text, so the message starts
    # with an ANSI escape and a prefix-anchored pattern never matches it.
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
    # dbt_common's logger opens transform/logs/dbt.log and never closes it, so running dbt
    # in-process leaks the handle and the interpreter reports it at collection. Both entries
    # are the same leak seen twice: once as the ResourceWarning, once as pytest surfacing the
    # unraisable exception from the finalizer. Scoped to that path so an unclosed file
    # anywhere else in this project still fails.
    "ignore:unclosed file .*dbt\\.log:ResourceWarning",
    "ignore:.*dbt\\.log.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/quantpulse"]
