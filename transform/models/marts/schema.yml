version: 2

models:
  - name: fct_daily_returns
    description: Per-(ticker, date) simple returns with 21-day rolling volatility and mean.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date]
    columns:
      - name: exchange
        tests: [not_null]
      - name: ticker
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: close
        description: Adjusted close.
        tests: [not_null]

  - name: fct_signal_performance
    description: >
      Signal-quintile forward performance: per date, predictions are bucketed into
      quintiles (1 = strongest signal) and paired with the next trading day's realized
      return. The monotonicity of avg_next_day_return across quintiles is the
      plainest read of whether the model ranks stocks usefully.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, exchange, signal_quintile]
    columns:
      - name: signal_quintile
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: n_tickers
        tests: [not_null]

  - name: fct_portfolio_daily
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, exchange]
    description: >
      Paper portfolio with cumulative return, running drawdown, rolling Sharpe, and
      the evidence phase: 'replay' before the first champion promotion, 'backfilled'
      for a day scored by a champion promoted after it, 'live' for the rest. Only
      'live' is out-of-sample; the other two are in-sample for different reasons.
    columns:
      - name: date
        tests: [not_null]
      - name: exchange
        tests: [not_null]
      - name: drawdown
        description: Running peak-to-current drawdown (always <= 0).
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= 0.0000001"
      - name: phase
        description: >
          'backfilled' catches a gap filled after a later promotion — the scoring model
          was trained on that day, so counting it as live would flatter the record with
          in-sample results and nothing about the date would reveal it.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["replay", "backfilled", "live"]

  - name: fct_portfolio_vs_benchmark
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, exchange]
    description: Strategy equity vs SPY buy-and-hold indexed to the portfolio's first date.
    columns:
      - name: date
        tests: [not_null]
      - name: exchange
        tests: [not_null]
      - name: portfolio_equity
        tests: [not_null]
      - name: benchmark_equity
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

  - name: fct_track_record
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [exchange, phase]
    description: >
      Per-phase performance summary. The 'live' row is the strategy's honest
      out-of-sample record; 'replay' is labeled in-sample history, and 'backfilled'
      (if present) is days scored retrospectively by a later champion — also in-sample,
      and kept as its own row rather than folded into either neighbour so that an
      outage is visible instead of quietly inflating the record.
    columns:
      - name: phase
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["replay", "backfilled", "live"]
      - name: n_days
        tests: [not_null]
      - name: win_rate
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"

  - name: fct_alpha_beta
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [exchange, phase]
    description: >
      CAPM decomposition vs SPY per evidence phase: beta (market exposure — a
      market-neutral book should sit near 0), annualized alpha (return earned
      independently of the market), R², tracking error, and information ratio. This is
      the fair read on a long/short strategy; raw return vs SPY is not. Phases carry the
      same meaning as in fct_portfolio_daily — only 'live' is out-of-sample.
    columns:
      - name: phase
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["replay", "backfilled", "live"]
      - name: n_days
        tests: [not_null]
      - name: alpha_std_error_annualized
        description: >
          Standard error of the alpha estimate. Null below min_days_for_ratios. A window can
          clear that floor and still resolve nothing, so this is what says whether the alpha
          means anything; quoting alpha without it reports noise as a return.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "alpha_std_error_annualized is not null"
      - name: alpha_t_stat
        description: >
          Alpha over its standard error. Above ~2 in absolute value the alpha is
          distinguishable from zero at roughly two sigma.

  - name: fct_champion_record
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [exchange, model_version]
    description: >
      Live-phase record per deployed model, so a champion's own performance can be read
      apart from the market's. fct_track_record pools every champion that has held the
      alias, which after a demotion is dominated for months by the model that was
      withdrawn. Replay is excluded: in-sample days say nothing about the model that
      happens to be attached to them. Ratios are nulled below min_days_for_ratios.
    columns:
      - name: exchange
        tests: [not_null]
      - name: model_version
        tests: [not_null]
      - name: n_days
        tests: [not_null]
      - name: is_current
        description: >
          True for the model holding the alias now, taken from the promotion audit trail.
          Not from max(model_version), which is text and ranks 'v9' above 'v10'; and not
          from the most recent live day either, because a champion promoted on a
          non-trading day has none — v10 was promoted on a Saturday, and dating it that way
          would have labelled the previous champion current until Monday.
        tests: [not_null]
      - name: start_date
        description: >
          Null until the model has scored a live session. A newly promoted champion appears
          with n_days 0 rather than being dropped, since omitting it leaves the table
          showing only withdrawn models with nothing marking the one running.

  - name: fct_iv_vs_forward_realized
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, snapshot_date]
    description: >
      Implied volatility beside the volatility that then arrived over the next 21 sessions,
      per (ticker, snapshot), and their difference — the forward variance risk premium.
      Only snapshots whose realization window has closed have a row. Descriptive: measured
      in docs/findings/forward-variance-risk-premium.md, not a signal.
    columns:
      - name: forward_realized_vol_21d
        description: >
          Annualised, like atm_iv: the sample standard deviation of the next 21 daily simple
          returns, scaled by sqrt(252). Bounded both ways below, because a series left in
          daily units reads as a premium of 0.30 at t 80 rather than as an error.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 5"
      - name: forward_premium
        description: atm_iv minus annualised forward realised vol; positive means options cost
          more than the movement that followed.
  - name: fct_iv_vs_realized
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, snapshot_date]
    description: >
      Implied volatility beside trailing realised volatility per (ticker, snapshot), and
      their difference — the variance risk premium. Backward-looking on purpose: comparing
      implied to *subsequent* realised volatility needs the realisation window to close,
      which only the earliest snapshots satisfy while this has a month of history.
      Descriptive only; one month says what the premium has been, not what it predicts.
    columns:
      - name: realized_vol_21d
        description: >
          Annualised. fct_daily_returns.volatility_21d is a daily standard deviation, so it
          is scaled by sqrt(252) here to match atm_iv, which the vendor supplies annualised.
          Subtracting them unscaled reports a premium of 0.30 at t 80 with every ticker-day
          positive — a unit mismatch that reads exactly like a strong result.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "realized_vol_21d is not null"
      - name: variance_premium
        description: atm_iv minus annualised realised vol; positive means options cost more
          than the underlying delivered.

  - name: fct_option_summary
    description: >
      Per-(ticker, snapshot) option-market read: ATM implied volatility and the
      put/call open-interest ratio. Accumulates history as snapshots run.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, snapshot_date]
    columns:
      - name: atm_iv
        tests: [not_null]
      - name: put_call_ratio
        description: Put OI / call OI (>1 = more put positioning).

  - name: fct_iv_surface
    description: Mean IV by expiry and moneyness bucket — the volatility smile/skew and term structure.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, snapshot_date, expiry, option_type, moneyness_bucket]
    columns:
      - name: avg_iv
        tests: [not_null]

  - name: dim_universe
    description: Universe members with price-coverage metadata.
    columns:
      - name: ticker
        tests: [unique, not_null]
      - name: asset_type
        tests:
          - accepted_values:
              arguments:
                values: ["stock", "etf"]

  - name: fct_gamma_by_strike
    description: >
      Option dollar gamma per 1% move by (snapshot, ticker, strike), calls and puts apart — the
      stock a hedger would trade if a dealer were on the other side of every live contract.
      The one definition the positioning marts and the strike profile read (ADR 0007).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, ticker, strike]
    columns:
      - name: call_gamma_usd_1pct
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: put_gamma_usd_1pct
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: fct_positioning
    description: >
      Per (ticker, snapshot): dealer hedging exposure from listed options against average dollar
      volume, and the short interest known that day — where the GameStop mechanics would be
      loaded. Fuel, not timing (ADR 0007).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, snapshot_date]
    columns:
      - name: exchange
        tests: [not_null]
      - name: followed_by
        description: Who follows the name, the model (its universe) or the research watchlist.
        tests: [not_null]
      - name: call_gamma_share_of_adv
        description: Call dollar gamma per 1% move over 20-session average dollar volume.
      - name: short_known_from
        description: When the joined short interest became known; never after snapshot_date.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= snapshot_date"

  - name: fct_attention
    description: >
      Per (ticker, date), the newest 400 days: the past week's mean Wikipedia views against the
      median of the 90 days before it — public attention, both markets (ADR 0007).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date]
    columns:
      - name: views_7d
        tests: [not_null]
      - name: attention_ratio
        description: Past week's mean views over the prior 90 days' median; null under 60 baseline days.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: fct_ownership
    description: >
      Per covered US stock, as of the newest filing: open-market insider buying and selling over
      90 days, and the holders whose latest 13D/13G still reports 5% or more (ADR 0007).
    columns:
      - name: ticker
        tests: [unique, not_null]
      - name: followed_by
        tests: [not_null]
      - name: planned_sold_share_90d
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"

  - name: fct_insider_trades
    description: >
      Open-market insider trades from Form 4, bought or sold: the one definition the ownership
      summary and the per-stock list read (ADR 0007).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [accession, seq]

  - name: fct_large_holders
    description: >
      Each filer's latest structured 13D/13G in the past two years that still reports 5% or more;
      an amendment under 5% is an exit (ADR 0007).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, filer]
