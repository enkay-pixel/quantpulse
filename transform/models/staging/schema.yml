version: 2

models:
  - name: stg_prices
    description: 1:1 view over raw daily bars.
    columns:
      - name: close
        tests: [not_null]

  - name: stg_universe
    description: 1:1 view over the configured universe.
    columns:
      - name: ticker
        tests: [unique, not_null]

  - name: stg_predictions
    description: One score per (ticker, date) — newest model version wins.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date]

  - name: stg_portfolio_snapshots
    description: >
      The live daily book per market. Variant is pinned; exchange is not, so the grain is
      (date, exchange) — one row per market per trading day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, exchange]
    columns:
      - name: date
        tests: [not_null]
      - name: exchange
        tests: [not_null]

  - name: stg_model_runs
    description: 1:1 view over the training/promotion audit log.
    columns:
      - name: id
        tests: [unique, not_null]

  - name: stg_option_quotes
    description: Option-chain snapshots with moneyness and days-to-expiry derived.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, ticker, expiry, strike, option_type]
    columns:
      - name: implied_volatility
        tests: [not_null]
      - name: option_type
        tests:
          - accepted_values:
              arguments:
                values: ["call", "put"]

  - name: stg_short_interest
    description: >
      Short interest per (ticker, settlement) with known_from, the US market date it first
      became known. Join history on known_from, never on settlement_date.
    columns:
      - name: known_from
        tests: [not_null]
      - name: shares_short
        tests: [not_null]

  - name: stg_page_views
    description: Daily Wikipedia views per stock article; an unpublished day is absent, not zero.
    columns:
      - name: views
        tests: [not_null]

  - name: stg_watchlist
    description: The research watchlist, one row per name (ADR 0007).
    columns:
      - name: ticker
        tests: [unique, not_null]

  - name: stg_watchlist_prices
    description: Daily bars for the watchlist's current names, with their market.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date]

  - name: stg_watchlist_option_quotes
    description: The watchlist's option chains for its current names, shaped like stg_option_quotes.

  - name: stg_research_names
    description: >
      Every name the research branch covers and who follows it, the model or the watchlist. A
      ticker appears once: the watchlist sync refuses a universe ticker.
    columns:
      - name: ticker
        tests: [unique, not_null]
      - name: followed_by
        tests:
          - accepted_values:
              arguments:
                values: [model, watchlist]

  - name: stg_insider_transactions
    description: Insider trades from Form 4 with their dollar value; code P is a purchase, S a sale.
    columns:
      - name: code
        tests: [not_null]

  - name: stg_holder_filings
    description: Structured 13D/13G stake disclosures; is_13d marks a holder who may seek influence.
