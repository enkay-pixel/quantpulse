version: 2

sources:
  - name: market
    description: Raw platform tables owned by the ingestion and ML pipelines (Alembic-managed).
    database: "{{ env_var('POSTGRES_DB', 'market') }}"
    schema: public
    tables:
      - name: prices
        description: Daily OHLCV bars per ticker from yfinance, idempotent upserts.
        meta:
          dagster:
            asset_key: raw_prices
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 4, period: day}
          error_after: {count: 8, period: day}
        columns:
          - name: ticker
            tests: [not_null]
          - name: close
            tests: [not_null]
      - name: universe
        description: Configured trading universe with active flags.
        columns:
          - name: ticker
            tests: [unique, not_null]
      - name: predictions
        description: Champion-model forward-return scores per (ticker, date, model_version).
        meta:
          dagster:
            asset_key: predictions
      - name: portfolio_snapshots
        description: >
          Simulated paper books, one row per trading day per market per book. Several
          constructions (see quantpulse.ml.portfolio.BOOKS) run over the same predictions
          for each exchange, so the grain is (date, exchange, variant) — the staging model
          pins the live daily book but keeps every market.
        meta:
          dagster:
            asset_key: portfolio_equity
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [date, exchange, variant]
        columns:
          - name: date
            tests: [not_null]
          - name: exchange
            tests: [not_null]
          - name: variant
            tests: [not_null]
      - name: model_runs
        description: >
          Training/promotion audit log written by the self-adapting loop, one champion
          lineage per market.
        meta:
          dagster:
            asset_key: champion_model
        columns:
          - name: id
            tests: [unique, not_null]
      - name: option_quotes
        description: Daily live option-chain snapshots with Black-Scholes Greeks.
        meta:
          dagster:
            asset_key: option_chains
      - name: short_interest
        description: >
          Shares sold short per ticker and settlement date (research branch, ADR 0007).
          Insert-only, so ingested_at is when each figure first became known.
        meta:
          dagster:
            asset_key: short_interest
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [ticker, settlement_date]
      - name: page_views
        description: >
          Daily Wikipedia views of each stock's article, both markets (research branch,
          ADR 0007). Insert-only; article records the title the views were counted on.
        meta:
          dagster:
            asset_key: page_views
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [ticker, date]
      - name: watchlist
        description: >
          The research watchlist (ADR 0007), synced from configs/watchlist.yaml: names the
          research branch follows that the model does not. Never a universe ticker.
        meta:
          dagster:
            asset_key: watchlist
        columns:
          - name: ticker
            tests: [unique, not_null]
      - name: watchlist_prices
        description: Daily adjusted bars for the watchlist's names, refetched in full each evening.
        meta:
          dagster:
            asset_key: watchlist_prices
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [ticker, date]
      - name: watchlist_option_quotes
        description: The watchlist's nightly option chains, in the universe's band.
        meta:
          dagster:
            asset_key: watchlist_chains
      - name: insider_transactions
        description: >
          Insider trades from Form 4 filings on SEC EDGAR, one row per trade (research branch,
          ADR 0007). Insert-only by accession and sequence.
        meta:
          dagster:
            asset_key: insider_transactions
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [accession, seq]
      - name: holder_filings
        description: >
          Structured Schedule 13D/13G disclosures of stakes over 5% (research branch, ADR 0007).
          Insert-only by accession.
        meta:
          dagster:
            asset_key: holder_filings
        columns:
          - name: accession
            tests: [unique, not_null]
      - name: financial_facts
        description: >
          Tagged figures from 10-K and 10-Q filings, from SEC EDGAR's XBRL facts (research branch,
          ADR 0007). Kept as reported, one row per filing; insert-only.
        meta:
          dagster:
            asset_key: financial_facts
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [ticker, concept, unit, period_end, duration_days, accession]
