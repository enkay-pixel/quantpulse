version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # The weekly update job had been failing since at least 07-23 with
      # dependency_file_not_resolvable on exactly these two, while the rest of the group
      # still opened a PR. Both reproduce with `uv lock --upgrade-package <pkg>==<latest>`.
      #
      #   dbt-core 1.12 — dagster-dbt caps dbt-core through its latest published release,
      #                 and no published version accepts 1.12. Confirmed to bite at
      #                 python 3.13 on darwin, i.e. the environment actually in use, not a
      #                 hypothetical resolver split. Self-clearing when dagster-dbt widens
      #                 its range. Note this is the SAME dependency that blocks python 3.14
      #                 (see the docker ignore below) — dbt is the tightest constraint in
      #                 this stack, from two directions at once.
      #
      #   pandas 3.x  — resolution fails; the cause is NOT established. An earlier version
      #                 of this comment blamed the ecosystem not supporting pandas 3, which
      #                 is wrong: nothing in uv.lock caps pandas below 3. Four constraint
      #                 combinations were tried on 2026-08-01 — bounding requires-python to
      #                 <3.15, to <3.14, restricting [tool.uv] environments to darwin+linux,
      #                 and both together — and it stayed blocked in every one. The traces
      #                 name mlflow version ranges without ever reaching a conclusion line.
      #                 Treat this as "unexplained", not "understood": if you need pandas 3,
      #                 the investigation starts fresh rather than from this comment.
      #
      # Minor and patch updates for both still come through. Nothing re-checks whether these
      # blockers have cleared, so they will outlive their reason unless someone re-runs the
      # command above.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # MINOR as well as major: 1.11.12 -> 1.12.0 moves the minor component, so a
      # major-only rule never matched it and the update job kept failing for a day after
      # the rule was added. Patches within 1.11.x still come through, which is what we
      # want — dagster-dbt's cap is on the minor, not on bug fixes.
      - dependency-name: "dbt-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # mypy is ignored ENTIRELY, not by update-type, and the earlier attempt to ignore only
      # its major was wrong. The major ignore did suppress 2.3.0 — and Dependabot simply fell
      # back to the highest allowed 1.x (1.20.0), which fails the same way:
      #
      #   Because quantpulse[dev] depends on mypy==1.19.1 and mypy==1.20.0,
      #   quantpulse[dev]'s requirements are unsatisfiable.
      #
      # That is the exact pin refusing ANY bump, not just majors, so no update-type filter
      # can help — each one only moves the failure down a version. The assumption in the
      # previous comment, that "Dependabot rewrites an exact pin", does not hold here.
      #
      # The pin is deliberate (local `make lint`/`make type` must run the tool CI gates on),
      # so the pin stays and the automation goes. Cost: mypy never gets an update PR, and
      # bumping it is a manual act — edit the pin, run `uv lock`, run the QA loop. That is
      # the honest trade for an exact pin, and worth doing periodically rather than never.
      - dependency-name: "mypy"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      js-deps:
        patterns: ["*"]
    ignore:
      # Majors deferred until their ecosystems align / a deliberate migration:
      # typescript 7 conflicts with typescript-eslint 8's peer range, eslint 10
      # needs typescript-eslint support, recharts 3 changes the chart API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    ignore:
      # Verified 2026-07-23 by building the image, not assumed: python:3.14-slim fails
      # at `dbt parse` with mashumaro UnserializableField on dbt-common's dataclass
      # schema — 3.14's deferred annotations (PEP 649) break its field introspection.
      # The API image builds fine; the dagster one cannot. Revisit when dbt-common
      # supports 3.14, then drop this rule.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
