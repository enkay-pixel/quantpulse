version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # pandas 3 is held back by decision, not by the resolver. Until 2026-10-31 this rule
      # existed because pandas 3 did not resolve (dependency_file_not_resolvable from 07-23,
      # cause never established); `uv lock --upgrade-package pandas` now reaches 3.1.0. It
      # stays because the features are computed with pandas, and until the shadow run's
      # verdict (about 2026-12-29) every week's refit must reproduce exactly, so nothing may
      # change what a past retrain trained on. A major is the release most likely to. Minor
      # and patch updates still come through. Recorded as `pandas-2x-until-shadow-verdict`
      # in configs/decisions.yaml, which reopens it when the verdict is saved.
      #
      # dbt-core had a rule here too, for the same resolver failure (dagster-dbt capped it
      # below 1.12). It resolved by 2026-10-31 and was taken then, so the rule went.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # mypy is ignored ENTIRELY, not by update-type, and the earlier attempt to ignore only
      # its major was wrong. The major ignore did suppress 2.3.0 — and Dependabot simply fell
      # back to the highest allowed 1.x (1.20.0), which fails the same way:
      #
      #   Because quantpulse[dev] depends on mypy==1.19.1 and mypy==1.20.0,
      #   quantpulse[dev]'s requirements are unsatisfiable.
      #
      # That is the exact pin refusing ANY bump, not just majors, so no update-type filter
      # can help — each one only moves the failure down a version. The assumption in the
      # previous comment, that "Dependabot rewrites an exact pin", does not hold here.
      #
      # The pin is deliberate (local `make lint`/`make type` must run the tool CI gates on),
      # so the pin stays and the automation goes. Cost: mypy never gets an update PR, and
      # bumping it is a manual act — edit the pin, run `uv lock`, run the QA loop. That is
      # the honest trade for an exact pin, and worth doing periodically rather than never.
      - dependency-name: "mypy"
      # A version cap written in pyproject.toml does not constrain this bot: when a bump is
      # blocked by our own upper bound, it WIDENS the bound and proposes the bump anyway. So a
      # deliberate cap only holds if it is repeated here as an ignore rule. Every cap in
      # pyproject.toml therefore needs an entry below, or it is decorative.
      #
      #   pandas-stubs — the stubs describe the library's API, so they can only move when the
      #                 runtime library moves. pandas itself is held on 2.x above, so the
      #                 stubs must be capped too; a stubs major on its own type-checks the
      #                 code against an API the installed pandas does not have.
      #
      #   yfinance    — capped pending a look at the 2.x API. No bump has been attempted yet,
      #                 so treat the cap as unreviewed rather than as a known incompatibility.
      - dependency-name: "pandas-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "yfinance"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      js-deps:
        patterns: ["*"]
    ignore:
      # Majors deferred until their ecosystems align / a deliberate migration:
      # typescript 7 conflicts with typescript-eslint 8's peer range, eslint 10
      # needs typescript-eslint support, recharts 3 changes the chart API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    ignore:
      # Verified 2026-07-23 by building the image, not assumed: python:3.14-slim fails
      # at `dbt parse` with mashumaro UnserializableField on dbt-common's dataclass
      # schema — 3.14's deferred annotations (PEP 649) break its field introspection.
      # The API image builds fine; the dagster one cannot. Revisit when dbt-common
      # supports 3.14, then drop this rule.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      # The MLflow server image follows the Python client in uv.lock, never the other way: a
      # registry client talking to a server from another release is the drift
      # scripts/check_tool_pins.py exists to stop. A bump of its own here would leave the two
      # mismatched (#60 was closed for exactly that). The client's bump in the python-deps PR
      # moves the image with it, through the Dependabot follow-up workflow.
      - dependency-name: "mlflow/mlflow"
