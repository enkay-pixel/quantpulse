name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantpulse
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantpulse -d market"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://quantpulse:ci-password@localhost:5432/market
    steps:
      - uses: actions/checkout@v7

      - name: Check the hook and CI agree on a uv version
        run: |
          hook_rev="$(grep -A1 'repo: https://github.com/astral-sh/uv-pre-commit$' \
            .pre-commit-config.yaml | sed -n 's/.*rev: *//p')"
          # Read the version out of the setup-uv block itself, not the first `version:` in
          # the file — pinning any other action would otherwise silently become the thing
          # this compares against.
          ci_ver="$(awk '/astral-sh\/setup-uv/{f=1} f && /version: "/{
            gsub(/.*version: "|".*/, ""); print; exit}' .github/workflows/ci.yml)"
          if [ -z "$hook_rev" ] || [ -z "$ci_ver" ]; then
            echo "could not read a uv version: hook='$hook_rev' ci='$ci_ver'" >&2
            exit 1
          fi
          if [ "$hook_rev" != "$ci_ver" ]; then
            echo "uv drift: .pre-commit-config.yaml=$hook_rev ci.yml=$ci_ver" >&2
            exit 1
          fi

      - name: Check the hook and pyproject agree on a ruff version
        # CI lints with the pinned ruff from uv.lock while commits are formatted by the
        # pre-commit hook's own copy. Nothing updates the hook rev when the pin moves, so
        # the two drift apart silently and the result is a commit the hook reformats and
        # CI then rejects. pyproject is the single source of truth; the hook must match it.
        run: |
          pin="$(sed -n 's/.*"ruff==\([0-9][^"]*\)".*/\1/p' pyproject.toml | head -1)"
          hook_rev="$(grep -A1 'repo: https://github.com/astral-sh/ruff-pre-commit$' \
            .pre-commit-config.yaml | sed -n 's/.*rev: *v*//p')"
          if [ -z "$pin" ] || [ -z "$hook_rev" ]; then
            echo "could not read a ruff version: pyproject='$pin' hook='$hook_rev'" >&2
            exit 1
          fi
          if [ "$pin" != "$hook_rev" ]; then
            echo "ruff drift: pyproject=$pin .pre-commit-config.yaml=v$hook_rev" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Pinned so CI and the uv-lock hook write the same lock format. Unpinned, CI
          # tracks whatever uv released this morning while the hook stays where it was,
          # and the lock they disagree about is the one every install reads.
          version: "0.11.29"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: dbt build (models + tests against service Postgres)
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          uv run quantpulse init-db
          uv run dbt deps --project-dir transform --profiles-dir transform
          uv run dbt build --project-dir transform --profiles-dir transform

      # `init-db` above brought the schema to head, so anything alembic still wants to
      # generate is a model edited without a migration. The tests cannot catch this: they
      # run the migrations, so they describe the schema rather than compare it to the
      # models, and the two can drift apart while everything stays green.
      - name: Models and migrations agree
        run: uv run alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config -q

  # The docs are the deliverable here as much as the code — a broken table renders as
  # literal pipes on GitHub, which is how the data-dictionary shipped a split table for
  # two weeks without anyone noticing.
  markdown:
    runs-on: ubuntu-latest
    env:
      # Keep in lockstep with the markdownlint-cli2 rev in .pre-commit-config.yaml; the
      # guard below fails the build on drift, so the hook and CI cannot disagree about
      # what counts as valid markdown.
      MARKDOWNLINT_VERSION: v0.23.2
    steps:
      - uses: actions/checkout@v7

      - name: Check the hook and CI agree on a markdownlint version
        run: |
          hook_rev="$(grep -A1 'repo: https://github.com/DavidAnson/markdownlint-cli2$' \
            .pre-commit-config.yaml | sed -n 's/.*rev: *//p')"
          if [ "$hook_rev" != "$MARKDOWNLINT_VERSION" ]; then
            echo "markdownlint drift: .pre-commit-config.yaml=$hook_rev ci.yml=$MARKDOWNLINT_VERSION" >&2
            exit 1
          fi

      - name: Check documentation links
        # Wikilinks render as literal brackets on GitHub, and relative links rot when docs
        # move. Both are invisible until a reader hits one.
        run: python3 scripts/check_doc_links.py

      - name: Lint markdown
        # The exclusions must be `**/`-prefixed: a bare `#node_modules` only matches the
        # top level, so `web/node_modules` and `transform/dbt_packages` would be linted —
        # vendored READMEs failing against this project's rules. It passes on a fresh
        # runner where neither directory exists, which is exactly how that stays hidden.
        run: |
          npx --yes markdownlint-cli2@"${MARKDOWNLINT_VERSION#v}" \
            "**/*.md" "#**/node_modules" "#**/dbt_packages"

  # The pre-commit gitleaks hook only protects machines that ran `make hooks`, and
  # `--no-verify` walks straight past it. This is the backstop. It cannot prevent a leak
  # — anything it catches is already pushed and must be ROTATED, not force-pushed away —
  # but it turns "never noticed" into "noticed in a minute".
  secrets:
    runs-on: ubuntu-latest
    env:
      # Keep in lockstep with the gitleaks rev in .pre-commit-config.yaml. The guard step
      # below fails the build if they drift, so CI and the hook can't disagree about what
      # counts as a secret.
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks walks history, so the default shallow clone would leave older commits
          # unscanned — exactly the ones a bypassed hook lands in.
          fetch-depth: 0

      - name: Check the hook and CI agree on a gitleaks version
        run: |
          hook_rev="$(grep -A1 'repo: https://github.com/gitleaks/gitleaks$' \
            .pre-commit-config.yaml | sed -n 's/.*rev: *//p')"
          if [ "$hook_rev" != "$GITLEAKS_VERSION" ]; then
            echo "gitleaks drift: .pre-commit-config.yaml=$hook_rev ci.yml=$GITLEAKS_VERSION" >&2
            exit 1
          fi

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan full history
        # --redact is not optional here: Actions logs on a public repo are public, so a
        # finding must never print the value that triggered it.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
