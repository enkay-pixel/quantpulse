repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  # detect-private-key above only catches private key material. This is a public repo,
  # where a leaked token has to be rotated (forks and GitHub's caches survive a
  # force-push), so scan every staged diff for API tokens too.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.29
    hooks:
      - id: uv-lock

  # Rules and their justifications live in .markdownlint.yaml — the defaults disagree with
  # conventions this project already chose (100-char prose to match ruff, the README's
  # <details> block), and without that config the tool reports ~830 problems, which is the
  # same as reporting none.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # scripts/ runs unattended under launchd, where a failure is silent by construction —
  # backup-market.sh is the only copy of data no vendor will sell back. All four pass
  # today; this is here so they keep passing.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # -x makes shellcheck follow `# shellcheck source=` directives. Without it every
        # script sourcing lib/dedup.sh fails SC1091, which went unnoticed only because the
        # hook runs on changed files and those scripts had stopped changing.
        args: [-x]

  # Scans every tracked markdown file, not just the staged ones, because a link breaks when
  # its *target* is renamed — the file that changed is rarely the file that now points at
  # nothing. `files:` still limits it to running when markdown is touched.
  - repo: local
    hooks:
      - id: doc-links
        name: documentation links resolve, and no wikilinks
        entry: python3 scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: \.md$
